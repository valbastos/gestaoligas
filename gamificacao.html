<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASMARA Gestão de Ligas - Gamificação</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --primary-color: #FF0066;
            --secondary-color: #6C0F5A;
            --light-color: #ffffff;
            --dark-color: #333333;
            --grey-color: #f5f5f5;
            --success-color: #28a745;
            --warning-color: #ffc107;
            --danger-color: #dc3545;
            --gold-color: #FFD700;
            --silver-color: #C0C0C0;
            --bronze-color: #CD7F32;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f0f2f5;
        }

        .app-container {
            display: flex;
        }

        .sidebar {
            background-color: white;
            width: 250px;
            height: 100vh;
            position: fixed;
            left: 0;
            top: 0;
            box-shadow: 2px 0 5px rgba(0,0,0,0.1);
            z-index: 100;
        }

        .sidebar-header {
            padding: 20px 0;
            text-align: center;
        }

        .sidebar-menu ul {
            list-style: none;
            padding: 0;
        }

        .sidebar-menu ul li {
            padding: 12px 20px;
            border-left: 4px solid transparent;
        }

        .sidebar-menu ul li.active {
            border-left-color: var(--primary-color);
            background-color: #ffeef5;
        }

        .sidebar-menu ul li a {
            color: var(--dark-color);
            text-decoration: none;
            display: block;
            font-size: 16px;
        }

        .sidebar-menu ul li.active a {
            color: var(--primary-color);
            font-weight: 600;
        }

        .main-content {
            flex: 1;
            margin-left: 250px;
        }

        .header {
            background-color: var(--primary-color);
            color: white;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .user-info {
            display: flex;
            align-items: center;
        }

        .username {
            margin-right: 15px;
            font-weight: 500;
        }

        .update-button {
            background-color: white;
            color: var(--primary-color);
            border: none;
            padding: 8px 15px;
            border-radius: 5px;
            font-weight: 600;
            cursor: pointer;
        }

        .dashboard-container {
            padding: 20px;
        }

        .last-update {
            margin-bottom: 20px;
            color: var(--dark-color);
        }

        .gamification-header {
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            padding: 20px;
            margin-bottom: 20px;
            text-align: center;
        }

        .gamification-header h2 {
            color: var(--primary-color);
            margin-bottom: 10px;
            font-size: 24px;
        }

        .gamification-header p {
            color: #666;
            margin-bottom: 15px;
        }

        .period-selector {
            display: inline-block;
            background-color: #f5f5f5;
            border-radius: 20px;
            padding: 5px;
            margin-top: 10px;
        }

        .period-selector button {
            background: none;
            border: none;
            padding: 8px 16px;
            border-radius: 15px;
            font-size: 14px;
            cursor: pointer;
            color: #666;
        }

        .period-selector button.active {
            background-color: var(--primary-color);
            color: white;
        }

        .gamification-cards {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }

        .gamification-card {
            background-color: white;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            text-align: center;
        }

        .trophy-icon {
            font-size: 48px;
            margin-bottom: 15px;
        }

        .gold {
            color: var(--gold-color);
        }

        .silver {
            color: var(--silver-color);
        }

        .bronze {
            color: var(--bronze-color);
        }

        .gamification-card h3 {
            font-size: 18px;
            color: var(--dark-color);
            margin-bottom: 10px;
        }

        .gamification-card .value {
            font-size: 20px;
            font-weight: bold;
            color: var(--primary-color);
            margin-bottom: 5px;
        }

        .gamification-card .subtitle {
            font-size: 14px;
            color: #666;
        }

        .rankings-container {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }

        .ranking-box {
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            padding: 20px;
        }

        .ranking-box h3 {
            color: var(--dark-color);
            margin-bottom: 20px;
            font-size: 18px;
            padding-bottom: 10px;
            border-bottom: 1px solid #eee;
        }

        .ranking-item {
            display: flex;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid #f5f5f5;
        }

        .ranking-position {
            width: 30px;
            height: 30px;
            background-color: #f5f5f5;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 15px;
            font-weight: 600;
            font-size: 14px;
        }

        .ranking-position.top-1 {
            background-color: var(--gold-color);
            color: white;
        }

        .ranking-position.top-2 {
            background-color: var(--silver-color);
            color: white;
        }

        .ranking-position.top-3 {
            background-color: var(--bronze-color);
            color: white;
        }

        .ranking-info {
            flex: 1;
        }

        .ranking-name {
            font-weight: 600;
            margin-bottom: 3px;
        }

        .ranking-detail {
            font-size: 14px;
            color: #666;
        }

        .ranking-value {
            font-weight: bold;
            color: var(--primary-color);
        }

        .badges-container {
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            padding: 20px;
            margin-bottom: 30px;
        }

        .badges-container h3 {
            color: var(--dark-color);
            margin-bottom: 20px;
            font-size: 18px;
            padding-bottom: 10px;
            border-bottom: 1px solid #eee;
        }

        .badges-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 20px;
        }

        .badge-item {
            text-align: center;
        }

        .badge-icon {
            width: 60px;
            height: 60px;
            background-color: #f5f5f5;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 10px;
            font-size: 24px;
        }

        .badge-icon.earned {
            background-color: #FFEEF5;
            color: var(--primary-color);
            border: 2px solid var(--primary-color);
        }

        .badge-icon.locked {
            background-color: #f5f5f5;
            color: #999;
        }

        .badge-name {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 3px;
        }

        .badge-description {
            font-size: 12px;
            color: #666;
        }

        .history-container {
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            padding: 20px;
        }

        .history-container h3 {
            color: var(--dark-color);
            margin-bottom: 20px;
            font-size: 18px;
            padding-bottom: 10px;
            border-bottom: 1px solid #eee;
        }

        .history-item {
            display: flex;
            padding: 15px 0;
            border-bottom: 1px solid #f5f5f5;
        }

        .history-date {
            width: 100px;
            font-weight: 600;
            color: #666;
        }

        .history-info {
            flex: 1;
        }

        .history-title {
            font-weight: 600;
            margin-bottom: 5px;
        }

        .history-description {
            font-size: 14px;
            color: #666;
        }

        .history-badge {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 12px;
            font-size: 12px;
            background-color: #FFEEF5;
            color: var(--primary-color);
            margin-left: 10px;
        }
