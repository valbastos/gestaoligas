<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASMARA Gestão de Ligas - Agenda de Visitas</title>
    <style>
        :root {
            --primary-color: #FF0066;
            --secondary-color: #6C0F5A;
            --light-color: #ffffff;
            --dark-color: #333333;
            --grey-color: #f5f5f5;
            --success-color: #28a745;
            --warning-color: #ffc107;
            --danger-color: #dc3545;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f0f2f5;
        }

        .app-container {
            display: flex;
        }

        .sidebar {
            background-color: white;
            width: 250px;
            height: 100vh;
            position: fixed;
            left: 0;
            top: 0;
            box-shadow: 2px 0 5px rgba(0,0,0,0.1);
            z-index: 100;
        }

        .sidebar-header {
            padding: 20px 0;
            text-align: center;
        }

        .sidebar-menu ul {
            list-style: none;
            padding: 0;
        }

        .sidebar-menu ul li {
            padding: 12px 20px;
            border-left: 4px solid transparent;
        }

        .sidebar-menu ul li.active {
            border-left-color: var(--primary-color);
            background-color: #ffeef5;
        }

        .sidebar-menu ul li a {
            color: var(--dark-color);
            text-decoration: none;
            display: block;
            font-size: 16px;
        }

        .sidebar-menu ul li.active a {
            color: var(--primary-color);
            font-weight: 600;
        }

        .main-content {
            flex: 1;
            margin-left: 250px;
        }

        .header {
            background-color: var(--primary-color);
            color: white;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .user-info {
            display: flex;
            align-items: center;
        }

        .username {
            margin-right: 15px;
            font-weight: 500;
        }

        .add-button {
            background-color: white;
            color: var(--primary-color);
            border: none;
            padding: 8px 15px;
            border-radius: 5px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
        }

        .add-button span {
            margin-left: 5px;
        }

        .dashboard-container {
            padding: 20px;
        }

        .agenda-header {
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            padding: 20px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .agenda-title h2 {
            color: var(--dark-color);
            margin-bottom: 5px;
        }

        .agenda-title .subtitle {
            color: #666;
            font-size: 14px;
        }

        .agenda-filters {
            display: flex;
            align-items: center;
        }

        .filter-group {
            margin-left: 15px;
        }

        .filter-label {
            font-size: 14px;
            color: #666;
            margin-bottom: 5px;
        }

        .filter-select {
            padding: 8px 12px;
            border: 1px solid #ddd;
            border-radius: 4px;
            min-width: 150px;
        }

        .agenda-layout {
            display: grid;
            grid-template-columns: 70% 30%;
            gap: 20px;
        }

        .calendar-container {
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            padding: 20px;
        }

        .calendar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .calendar-title {
            font-size: 18px;
            font-weight: 600;
            color: var(--dark-color);
        }

        .calendar-navigation {
            display: flex;
            align-items: center;
        }

        .calendar-nav-button {
            background: none;
            border: none;
            padding: 5px 10px;
            cursor: pointer;
            color: #666;
            font-size: 16px;
        }

        .calendar-nav-button:hover {
            color: var(--primary-color);
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 10px;
        }

        .calendar-weekday {
            text-align: center;
            font-weight: 600;
            color: #666;
            padding: 10px 0;
            font-size: 14px;
        }

        .calendar-day {
            border: 1px solid #eee;
            border-radius: 4px;
            padding: 10px;
            min-height: 100px;
            position: relative;
        }

        .calendar-date {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 10px;
            text-align: right;
        }

        .calendar-day.today {
            background-color: #FFEEF5;
            border-color: var(--primary-color);
        }

        .calendar-day.inactive {
            background-color: #f9f9f9;
            color: #ccc;
        }

        .event {
            background-color: #f0f2f5;
            border-left: 3px solid var(--primary-color);
            padding: 5px;
            margin-bottom: 5px;
            font-size: 12px;
            cursor: pointer;
            border-radius: 2px;
        }

        .event.completed {
            border-left-color: var(--success-color);
            background-color: #d1fae5;
        }

        .event.missed {
            border-left-color: var(--danger-color);
            background-color: #fee2e2;
        }

        .event-time {
            font-weight: 600;
        }

        .sidebar-agenda {
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .sidebar-section {
            padding: 20px;
            border-bottom: 1px solid #eee;
        }

        .sidebar-section:last-child {
            border-bottom: none;
        }

        .sidebar-section h3 {
            color: var(--dark-color);
            margin-bottom: 15px;
            font-size: 16px;
        }

        .next-visits-list {
            list-style: none;
        }

        .next-visit-item {
            margin-bottom: 15px;
            padding-bottom: 15px;
            border-bottom: 1px solid #f5f5f5;
        }

        .next-visit-item:last-child {
            margin-bottom: 0;
            padding-bottom: 0;
            border-bottom: none;
        }

        .next-visit-date {
            font-size: 14px;
            font-weight: 600;
            color: var(--primary-color);
            margin-bottom: 5px;
        }

        .next-visit-details {
            font-size: 14px;
        }

        .stats-box {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }

        .stat-item {
            background-color: #f9f9f9;
            padding: 15px;
            border-radius: 4px;
            text-align: center;
        }

        .stat-value {
            font-size: 24px;
            font-weight: bold;
            color: var(--primary-color);
            margin-bottom: 5px;
        }

        .stat-label {
            font-size: 12px;
            color: #666;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 500px;
            padding: 20px;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 1px solid #eee;
        }

        .modal-title {
            font-size: 18px;
            font-weight: 600;
            color: var(--dark-color);
        }

        .close-button {
            background: none;
            border: none;
            font-size: 20px;
            cursor: pointer;
            color: #666;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            color: var(--dark-color);
        }

        .form-control {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
        }

        textarea.form-control {
            min-height: 100px;
        }

        .form-buttons {
            display: flex;
            justify-content: flex-end;
            margin-top: 20px;
        }

        .btn {
            padding: 10px 15px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
        }

        .btn-secondary {
            background-color: #f5f5f5;
            color: #666;
            margin-right: 10px;
        }

        .btn-primary {
            background-color: var(--primary-color);
            color: white;
        }

        @media (max-width: 1024px) {
            .agenda-layout {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 768px) {
            .sidebar {
                width: 70px;
                overflow: hidden;
            }
            
            .sidebar-menu ul li a {
                font-size: 0;
            }
            
            .main-content {
                margin-left: 70px;
            }
            
            .agenda-header {
                flex-direction: column;
                align-items: flex-start;
            }
            
            .agenda-filters {
                margin-top: 15px;
                flex-direction: column;
                align-items: flex-start;
            }
            
            .filter-group {
                margin-left: 0;
                margin-top: 10px;
                width: 100%;
            }
            
            .calendar-grid {
                gap: 5px;
            }
            
            .calendar-day {
                min-height: 80px;
                padding: 5px;
            }
        }
    </style>
</head>
